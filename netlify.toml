# LOONA Hub — Netlify config
# Deploy: put index.html at the site root and this folder structure alongside it.

[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

# flag.loona.in — a clean, branded custom domain for the Independence Day
# microsite so an Instagram bio/caption link never has to show the
# loonahub.netlify.app domain. Add "flag.loona.in" as a custom domain on
# this Netlify site (Site settings → Domain management), then point a CNAME
# for "flag" at loonahub.netlify.app in loona.in's DNS (GoDaddy). Scoped to
# that one domain via the absolute "from" URL — every other domain/path on
# this site (including the dashboard's own domain) is untouched. force is
# required because "/" already resolves to the dashboard's index.html.
# Only the exact root path is rewritten (no wildcard) — the microsite's own
# requests for /assets/independence-day/* and /.netlify/functions/* need to
# keep resolving normally on this domain too, not get double-prefixed with
# /independence/ on top of their already-absolute paths. The query string
# (e.g. ?from=slug on a shared referral link) is forwarded automatically.
# The login gate is also bypassed for this host — see basic-auth.ts.
[[redirects]]
  from = "https://flag.loona.in/"
  to = "/independence/"
  status = 200
  force = true

# Live read endpoint (hub calls this): /.netlify/functions/petpooja-attendance
#
# Daily scheduled sync into Firebase (persists history for everyone).
# 14:30 UTC = 20:00 IST — after the workday. Adjust the cron as you like.
[functions."petpooja-sync"]
  schedule = "30 14 * * *"

# Auto-creates the day's rotating "Introduce brand of the day" task.
# 18:30 UTC = 00:00 IST — right at the start of the new day.
[functions."brand-of-day"]
  schedule = "30 18 * * *"

# Monthly content plan, prepared a month ahead — on the 1st, "<Next Month>
# Plan for <Brand>" (due the 10th); on the 10th, "Share the <Next Month>
# Plan with <Brand>" (due the 17th), one per retainer brand's strategy
# lead(s). Runs daily (it no-ops itself on every other day) — 18:35 UTC =
# 00:05 IST, just after brand-of-day so the two don't fire in the same
# minute.
[functions."monthly-plan-tasks"]
  schedule = "35 18 * * *"

# Pulls each team member's calendar (via Workspace domain-wide delegation) into
# Firebase and auto-creates a "Meeting: ..." task per known attendee. Runs every
# 5 minutes as a background safety net (Calendar API's free quota is far higher
# than this could ever use) — the Calendar tab's "Sync now" button triggers this
# same function on demand for instant reflection right after creating a meeting.
[functions."calendar-sync"]
  schedule = "*/5 * * * *"

# Keeps a Google Sheet in step with Firebase's live /members +
# /inactive_members — see employee-sheet-sync.js for the full picture. Every
# 15 minutes: roster edits are an occasional admin action, not something
# that needs calendar-sync's 5-minute cadence, and a wider interval keeps
# Sheets API usage comfortably clear of quota.
[functions."employee-sheet-sync"]
  schedule = "*/15 * * * *"

# Keeps "Attendance Master Loona" (a SEPARATE spreadsheet — see
# attendance-sheet-sync.js) in step with Firebase's live /loona_attendance +
# /loona_excused + /loona_late_forgiven. This one is heavier than the
# roster sync above — it rewrites a "Master Details" tab plus one tab per
# month with real punch data, re-deriving each day's status/late-fine from
# raw punches every run — so it runs hourly rather than every 15 minutes,
# comfortably inside Sheets API quota.
[functions."attendance-sheet-sync"]
  schedule = "0 * * * *"

# Posts the daily "Read Today's Oracle" / "Find Your Co-Star" nudges to the
# Loona Board for everyone. 04:30 UTC = 10:00 IST.
[functions."loona-daily-broadcast"]
  schedule = "30 4 * * *"

# Loona Brain Check's daily cut-off — locks in today's winner (highest score,
# fastest completion breaks a tie) and posts the winner announcement to the
# Loona Board. 06:30 UTC = 12:00 IST.
[functions."brain-check-winner"]
  schedule = "30 6 * * *"

# Generates the day's "Marketing News in 60 Seconds" card on the Loonaverse
# page — the model searches the web and summarizes 5 real current stories.
# 04:00 UTC = 09:30 IST, ahead of the 10:00 IST daily broadcast.
[functions."marketing-news-daily"]
  schedule = "0 4 * * *"

# Culture Lottery's daily personalized book/movie/word draw for every onboarded
# profile. 04:15 UTC = 09:45 IST, ahead of the 10:00 IST daily broadcast.
[functions."culture-lottery-daily"]
  schedule = "15 4 * * *"

# Culture Lottery's weekly taste-evolution summary. 04:30 UTC Sunday = 10:00
# IST Sunday.
[functions."culture-lottery-weekly"]
  schedule = "30 4 * * 0"

# Posts a Loona Board notification for every task whose due date was
# yesterday and is still not done — one shared board, so it's already
# visible to both whoever it's assigned to and whoever assigned it (and
# Gokul, and everyone else). 02:30 UTC = 08:00 IST.
[functions."overdue-tasks-daily"]
  schedule = "30 2 * * *"

# Set these in Netlify → Site settings → Environment variables (NOT in code):
#   PETPOOJA_CLIENT_ID
#   PETPOOJA_CLIENT_SECRET
#   PETPOOJA_BASE_URL
#   FIREBASE_DB_URL   (optional; defaults to the loona-hub RTDB)
#   BASIC_AUTH_CREDENTIALS   (site-wide password gate — see netlify/edge-functions/basic-auth.ts.
#                             Format: username:password. Without this set, the site is NOT gated.)
#   INDEPENDENCE_ADMIN_PASSWORD   (gates /independence/admin/, the internal live-participants
#                             list for the Independence Day microsite — see
#                             netlify/functions/independence-admin.js. /independence/* is
#                             excluded from BASIC_AUTH_CREDENTIALS above so the public hoist
#                             flow stays login-free, which is exactly why this admin subpath
#                             needs its own separate password. Without this set, the admin
#                             page rejects every password — fails closed, not open.)
#   OPENAI_API_KEY           (used by notes-summarize + tasks-extract for note/task generation,
#                             by chat.js for the dashboard AI assistant, by marketing-news-daily
#                             for the Loonaverse "Marketing News" card — that one calls the
#                             Responses API's web_search_preview tool to ground its summaries in
#                             real, current stories rather than inventing them, so the key needs
#                             web search available on the account — and by culture-lottery-daily/
#                             culture-lottery-generate for each person's daily book/movie/word
#                             pick, which doesn't need web search since it's not time-sensitive)
#   SARVAM_API_KEY           (Sarvam AI batch speech-to-text, used by Loona Notes' meeting
#                             recorder — see netlify/functions/sarvam-*.js)
#   GOOGLE_CALENDAR_SERVICE_ACCOUNT   (full JSON key contents for the service account
#                             authorized for domain-wide delegation in Workspace Admin —
#                             see netlify/functions/calendar-sync.js. Also accepts the
#                             "GOOGLE_CALENDER_SERVICE_ACCOUNT" misspelling if that's
#                             what's actually set in the Netlify dashboard.
#                             Needs ALL FOUR of these scopes authorized for its Client ID
#                             in Workspace Admin > Security > API Controls > Domain-wide
#                             Delegation (add each one alongside the others, don't replace
#                             any of them):
#                               https://www.googleapis.com/auth/calendar.readonly
#                               https://www.googleapis.com/auth/calendar.events
#                               https://www.googleapis.com/auth/documents
#                               https://www.googleapis.com/auth/drive.file
#                             calendar.events is only needed for "+ New Meeting" / editing
#                             (calendar-create.js / calendar-update.js). documents +
#                             drive.file are only needed for Loona Notes' "Export as Doc"
#                             (calendar-sync.js is read-only and works with just the first
#                             scope) — see docs-export.js.)
#   GOOGLE_EMPLOYEE_SHEET_ID   (the live-tracking employee Google Sheet — see
#                             netlify/functions/employee-sheet-sync.js. Reuses the SAME
#                             GOOGLE_CALENDAR_SERVICE_ACCOUNT above, but does NOT need
#                             domain-wide delegation — it authenticates as the service
#                             account itself, not an impersonated user. One-time setup:
#                               1. Create a blank Google Sheet.
#                               2. Share it (top-right "Share" button) with the
#                                  service account's own email — the "client_email"
#                                  field inside the GOOGLE_CALENDAR_SERVICE_ACCOUNT JSON
#                                  key — as an Editor.
#                               3. Copy the sheet's ID out of its URL: the long segment
#                                  between /d/ and /edit in
#                                  https://docs.google.com/spreadsheets/d/THIS_PART/edit
#                               4. Set that as GOOGLE_EMPLOYEE_SHEET_ID here.
#                             The function creates its own "Master Employee Data" tab on
#                             first run and fully rewrites that tab's data every 15
#                             minutes — safe to leave other tabs/notes elsewhere in the
#                             same spreadsheet.)
#   FIREBASE_ADMIN_SERVICE_ACCOUNT   (optional — full JSON key contents for a Firebase
#                             Admin service account on THIS project. Only needed to
#                             include PAN/Aadhar/bank details in the employee sheet above
#                             (they live in /members_sensitive, which has a tighter
#                             database rule the plain unauthenticated reads elsewhere in
#                             employee-sheet-sync.js can't get past). Without this set,
#                             the sync still runs fine — those columns are just left
#                             blank. One-time setup: Firebase Console -> Project Settings
#                             -> Service Accounts -> "Generate new private key", then
#                             paste the downloaded JSON's full contents here. Unlike
#                             GOOGLE_CALENDAR_SERVICE_ACCOUNT, this key does NOT need to
#                             be shared with anything — Admin SDK credentials bypass
#                             database rules by design, on their own.)
#   GOOGLE_ATTENDANCE_SHEET_ID   (the "Attendance Master Loona" spreadsheet — see
#                             netlify/functions/attendance-sheet-sync.js. Same one-time
#                             setup as GOOGLE_EMPLOYEE_SHEET_ID above, just a DIFFERENT
#                             spreadsheet: create/open it, share it with the Sheets
#                             service account's client_email as Editor, copy its ID out
#                             of its URL, set it here. The function creates its own
#                             "Master Details" tab plus one tab per month with real punch
#                             data on first run, fully rewriting all of them hourly.)
#   FIREBASE_WEB_API_KEY     (optional — defaults to the same public Web API key already
#                             embedded in index.html's client-side Firebase config. Used by
#                             add-to-playlist.js/remove-from-playlist.js to verify a caller's
#                             Firebase ID token via the Identity Toolkit REST API. Not a
#                             secret — Firebase web API keys are meant to be public; real
#                             access control is Firebase Auth + database rules.)
#
# Loona Radio (netlify/functions/resolve-track.js, add-to-playlist.js,
# remove-from-playlist.js) — every track add/remove goes through ONE Spotify
# account (Gokul's) so teammates never need their own Spotify login, since
# Spotify Dev Mode caps a new app at 5 authorized users:
#   SPOTIFY_CLIENT_ID / SPOTIFY_CLIENT_SECRET   (from a Spotify Developer Dashboard app —
#                             https://developer.spotify.com/dashboard)
#   SPOTIFY_REFRESH_TOKEN    (Gokul's own — see one-time setup below)
#   SPOTIFY_PLAYLIST_ID      (fallback only — radio/config/spotifyPlaylistId in Firebase
#                             is checked FIRST, so the playlist can be swapped without a
#                             redeploy; set this env var too so there's still a working
#                             default if that Firebase value is ever cleared)
#
#   One-time setup for SPOTIFY_REFRESH_TOKEN (do this once, as Gokul, from any machine —
#   there's no in-app UI for this on purpose, it's a one-time credential exchange):
#     1. Create an app at https://developer.spotify.com/dashboard, add a redirect URI of
#        http://127.0.0.1:8080/callback (or any URI you can catch locally).
#     2. Visit (as Gokul, logged into open.spotify.com with the account that owns/can edit
#        the Loona Radio playlist):
#          https://accounts.spotify.com/authorize?client_id=YOUR_CLIENT_ID&response_type=code&redirect_uri=http://127.0.0.1:8080/callback&scope=playlist-modify-public%20playlist-modify-private
#     3. Copy the "code" query param from the redirect, then exchange it for tokens:
#          curl -X POST https://accounts.spotify.com/api/token \
#            -H "Authorization: Basic $(echo -n CLIENT_ID:CLIENT_SECRET | base64)" \
#            -d grant_type=authorization_code -d code=THE_CODE \
#            -d redirect_uri=http://127.0.0.1:8080/callback
#     4. Paste the response's "refresh_token" into Netlify as SPOTIFY_REFRESH_TOKEN.
#   Also set radio/config/spotifyPlaylistId (and optionally appleMusicPlaylistUrl) directly
#   in the Firebase Realtime Database console — no admin UI for these either, by design.
