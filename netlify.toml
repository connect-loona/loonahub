# LOONA Hub — Netlify config
#
# Two apps share this one Netlify site: the legacy Hub (plain static files, unchanged) and
# Strategy OS (React + TypeScript + Vite, under apps/strategy/, served at /strategy/). The
# build command (scripts/build-dist.js) assembles both into dist/ — the legacy Hub's files
# are copied in verbatim, Strategy OS's own Vite build lands at dist/strategy/. See that
# script's own comment for why an allowlist of legacy files/dirs, not a denylist.
#
# This is a real behavior change from the plain static-file deploy this site used to be
# (no [build] command at all) — a bad `npm install` or a Vite config mistake can now fail a
# deploy. Netlify's failure mode for that is to keep serving the last successful deploy, not
# take the site down, but still: validate on a PR's deploy preview before merging build
# changes to main, same as any other change here.
[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# Node is pinned in .nvmrc rather than as NODE_VERSION here, deliberately.
#
# Both apps build with Vite 8, which needs Node ^20.19 or >=22.12, so the version must be
# pinned somewhere. But a build.environment entry also becomes part of every function's
# environment, and this site is already at AWS Lambda's 4KB environment limit — the limit that
# was failing every function upload at deploy time. .nvmrc pins the build identically and costs
# the function environment nothing.

# The Strategy rule must come before the general fallback (there isn't one for the legacy
# Hub — it's plain multi-page static files, not a client-routed SPA, so no /* -> /index.html
# catch-all exists or should exist here). This one's scoped to exactly /strategy/* so a
# client-side route inside the Strategy app (e.g. /strategy/runs/abc123) still resolves to
# its index.html instead of 404ing — everything else on this site keeps resolving to real
# files exactly as it does today.
[[redirects]]
  from = "/strategy/*"
  to = "/strategy/index.html"
  status = 200

# Strategy is an internal, fast-moving application. Its HTML must never be restored from a
# stale browser/CDN cache: an older document can point at a stylesheet from a prior atomic
# deploy and leave the React UI mounted but completely unstyled. Hashed JavaScript remains
# safe to cache on its own; this scoped response header prioritises correctness for every
# Strategy route and asset fallback over a negligible amount of transfer.
[[headers]]
  for = "/strategy/*"
  [headers.values]
    Cache-Control = "no-store, max-age=0, must-revalidate"

# Visual Studio, same arrangement as Strategy OS above and for the same reason: scoped to
# exactly /visual/* so a client-side route inside it still resolves to its index.html, while
# every other path on this site keeps resolving to a real file.
[[redirects]]
  from = "/visual/*"
  to = "/visual/index.html"
  status = 200

[functions]
  node_bundler = "esbuild"
  # Strategy OS's brand config/prompts/learnings data used to be read at runtime via
  # fs.readFileSync(path.join(__dirname, ...)) from netlify/functions/lib/strategy/{seed,
  # prompts}/* — that broke live (verified: "No brand config found ... not in Firebase,
  # no seed file") because esbuild concatenates every require()'d module into ONE output
  # file per function, so __dirname inside the bundle no longer points at that file's
  # original nested directory. `included_files` alone does NOT fix this — it correctly
  # copies the files into the deploy, but the bundled code's computed path still doesn't
  # match where they land. The actual fix was to stop reading them via fs at runtime
  # entirely: netlify/functions/lib/strategy/store.js now require()s the seed JSON and an
  # inlined prompts-data.js directly, so esbuild bundles the literal data into the same
  # output file — no separate file to locate at runtime, no __dirname involved at all.

# flag.loona.in — a clean, branded custom domain for the Independence Day
# microsite so an Instagram bio/caption link never has to show the
# loonahub.netlify.app domain. Add "flag.loona.in" as a custom domain on
# this Netlify site (Site settings → Domain management), then point a CNAME
# for "flag" at loonahub.netlify.app in loona.in's DNS (GoDaddy). Scoped to
# that one domain via the absolute "from" URL — every other domain/path on
# this site (including the dashboard's own domain) is untouched. force is
# required because "/" already resolves to the dashboard's index.html.
# Only the exact root path is rewritten (no wildcard) — the microsite's own
# requests for /assets/independence-day/* and /.netlify/functions/* need to
# keep resolving normally on this domain too, not get double-prefixed with
# /independence/ on top of their already-absolute paths. The query string
# (e.g. ?from=slug on a shared referral link) is forwarded automatically.
# The edge gate allows only microsite routes on this host — see basic-auth.ts.
[[redirects]]
  from = "https://flag.loona.in/"
  to = "/independence/"
  status = 200
  force = true

# Live read endpoint (hub calls this): /.netlify/functions/petpooja-attendance
#
# Daily scheduled sync into Firebase (persists history for everyone).
# 14:30 UTC = 20:00 IST — after the workday. Adjust the cron as you like.
[functions."petpooja-sync"]
  schedule = "30 14 * * *"

# Auto-creates the day's rotating "Introduce brand of the day" task.
# 18:30 UTC = 00:00 IST — right at the start of the new day.
[functions."brand-of-day"]
  schedule = "30 18 * * *"

# Monthly content plan, prepared a month ahead — on the 1st, "<Next Month>
# Plan for <Brand>" (due the 10th); on the 10th, "Share the <Next Month>
# Plan with <Brand>" (due the 17th), one per retainer brand's strategy
# lead(s). Runs daily (it no-ops itself on every other day) — 18:35 UTC =
# 00:05 IST, just after brand-of-day so the two don't fire in the same
# minute.
[functions."monthly-plan-tasks"]
  schedule = "35 18 * * *"

# Pulls each team member's calendar (via Workspace domain-wide delegation) into
# Firebase and auto-creates a "Meeting: ..." task per known attendee. Runs every
# 5 minutes as a background safety net (Calendar API's free quota is far higher
# than this could ever use) — the Calendar tab's "Sync now" button triggers this
# same function on demand for instant reflection right after creating a meeting.
[functions."calendar-sync"]
  schedule = "*/5 * * * *"

# Keeps a Google Sheet in step with Firebase's live /members +
# /inactive_members — see employee-sheet-sync.js for the full picture. Every
# 15 minutes: roster edits are an occasional admin action, not something
# that needs calendar-sync's 5-minute cadence, and a wider interval keeps
# Sheets API usage comfortably clear of quota.
[functions."employee-sheet-sync"]
  schedule = "*/15 * * * *"

# Keeps "Attendance Master Loona" (a SEPARATE spreadsheet — see
# attendance-sheet-sync.js) in step with Firebase's live /loona_attendance +
# /loona_excused + /loona_late_forgiven. This one is heavier than the
# roster sync above — it rewrites a "Yearly Summary" tab plus one
# richly-formatted tab per month with real punch data, re-deriving each
# day's status/late-fine from raw punches every run — so it runs hourly
# rather than every 15 minutes, comfortably inside Sheets API quota.
[functions."attendance-sheet-sync"]
  schedule = "0 * * * *"

# Posts the daily "Read Today's Oracle" / "Find Your Co-Star" nudges to the
# Loona Board for everyone. 04:30 UTC = 10:00 IST.
[functions."loona-daily-broadcast"]
  schedule = "30 4 * * *"

# Loona Brain Check's daily cut-off — locks in today's winner (highest score,
# fastest completion breaks a tie) and posts the winner announcement to the
# Loona Board. 06:30 UTC = 12:00 IST.
[functions."brain-check-winner"]
  schedule = "30 6 * * *"

# Generates the day's "Marketing News in 60 Seconds" card on the Loonaverse
# page — the model searches the web and summarizes 5 real current stories.
# 04:00 UTC = 09:30 IST, ahead of the 10:00 IST daily broadcast.
[functions."marketing-news-daily"]
  schedule = "0 4 * * *"

# Culture Lottery's daily personalized book/movie/word draw for every onboarded
# profile. 04:15 UTC = 09:45 IST, ahead of the 10:00 IST daily broadcast.
[functions."culture-lottery-daily"]
  schedule = "15 4 * * *"

# Culture Lottery's weekly taste-evolution summary. 04:30 UTC Sunday = 10:00
# IST Sunday.
[functions."culture-lottery-weekly"]
  schedule = "30 4 * * 0"

# Posts a Loona Board notification for every task whose due date was
# yesterday and is still not done — one shared board, so it's already
# visible to both whoever it's assigned to and whoever assigned it (and
# Gokul, and everyone else). 04:45 UTC = 10:15 IST.
[functions."overdue-tasks-daily"]
  schedule = "45 4 * * *"

# Set these in Netlify → Site settings → Environment variables (NOT in code):
#   PETPOOJA_CLIENT_ID
#   PETPOOJA_CLIENT_SECRET
#   PETPOOJA_BASE_URL
#   FIREBASE_DB_URL   (optional; defaults to the loona-hub RTDB)
#   BASIC_AUTH_CREDENTIALS   (site-wide password gate — see netlify/edge-functions/basic-auth.ts.
#                             Format: username:password. Missing/malformed values block private pages with 503.)
#   INDEPENDENCE_ADMIN_PASSWORD   (gates /independence/admin/, the internal live-participants
#                             list for the Independence Day microsite — see
#                             netlify/functions/independence-admin.js. /independence/* is
#                             excluded from BASIC_AUTH_CREDENTIALS above so the public hoist
#                             flow stays login-free, which is exactly why this admin subpath
#                             needs its own separate password. Without this set, the admin
#                             page rejects every password — fails closed, not open.)
#   OPENAI_API_KEY           (used by notes-summarize + tasks-extract for note/task generation,
#                             by chat.js for the dashboard AI assistant, by marketing-news-daily
#                             for the Loonaverse "Marketing News" card — that one calls the
#                             Responses API's web_search_preview tool to ground its summaries in
#                             real, current stories rather than inventing them, so the key needs
#                             web search available on the account — and by culture-lottery-daily/
#                             culture-lottery-generate for each person's daily book/movie/word
#                             pick, which doesn't need web search since it's not time-sensitive.
#                             ALSO reused (same key, no separate credential) by Strategy OS's
#                             Research + Strategy stages via the OpenAI Agents SDK — see
#                             netlify/functions/lib/strategy/runtime-openai.js.)
#                             Visual Studio also uses this key for image generation, the
#                             conversational prompt rewrite, and evidence-based image review.)
#   VISUAL_OPENAI_MODEL      (optional image model; defaults to gpt-image-1.)
#   VISUAL_PROMPT_MODEL      (optional OpenAI text model used to turn short follow-ups into
#                             self-contained image prompts; defaults to gpt-4.1-mini.)
#   VISUAL_QC_MODEL          (optional OpenAI vision model for on-demand quality review;
#                             defaults to gpt-4.1.)
#   VISUAL_JOB_SECRET        (optional signing secret for Visual Studio background jobs.
#                             Set a long random value in production; BASIC_AUTH_CREDENTIALS
#                             is used as the fallback so unsigned jobs always fail closed.)
#   MAGNIFIC_API_KEY         (server-only key for Magnific Mystic generation and Precision
#                             enhancement in Visual Studio. Never expose this to Vite/React.)
#   OPENAI_ADMIN_KEY         (optional OpenAI organization Admin API key, used read-only by
#                             Visual Studio's API Control Room for provider-reported usage and
#                             spend. This is separate from OPENAI_API_KEY.)
#   OPENAI_MONTHLY_BUDGET_USD
#                            (optional management budget shown in the Control Room; remaining
#                             budget is this value minus provider-reported monthly spend.)
#   MAGNIFIC_MONTHLY_CREDIT_ALLOWANCE
#                            (optional plan allowance. Magnific's Business/Enterprise analytics
#                             reports credits consumed; Hub subtracts that from this value.)
#   FIREBASE_API_KEY         (optional; the public Firebase Web API key used server-side to
#                             resolve a signed-in user's ID token for usage attribution.)
#   STRATEGY_OPENAI_MODEL    (optional — model id for Strategy OS stages running on OpenAI;
#                             defaults to "gpt-5.4" if unset. Never hard-code a model name in
#                             code, per the Strategy OS build brief — change it here instead.)
#   STRATEGY_OPENAI_MODEL_ECONOMY
#                            (optional — the cheap tier, defaults to "gpt-4o-mini". Used only
#                             by stages listed in pipeline.js's STAGE_MODEL_TIERS, which today
#                             is Deck Builder alone: it decides nothing, it lays already-
#                             approved content into a fixed schema. If its first attempt fails
#                             validation the stage escalates itself to the standard model, so
#                             a too-weak economy model costs one wasted call, not a dead run.)
#   ANTHROPIC_API_KEY        (Claude, used by Strategy OS's Claude runtime — see
#   or CLAUDE_API_KEY         netlify/functions/lib/strategy/runtime-claude.js. EITHER name works:
#                             ANTHROPIC_API_KEY is the SDK's own name and what this file always
#                             documented, but CLAUDE_API_KEY is the name actually set in the
#                             dashboard, so the runtime reads both rather than making anyone
#                             re-enter a working secret (same approach as
#                             GOOGLE_CALENDER_SERVICE_ACCOUNT's misspelling below).
#                             Any stage can run on Claude — the New run wizard's Advanced block
#                             picks a default and optional per-stage overrides — and whichever
#                             provider a stage isn't using is its automatic failover when the
#                             other is out of credits or unreachable (runtime-failover.js).)
#   STRATEGY_CLAUDE_MODEL    (optional — model id for stages running on Claude; defaults to
#                             "claude-opus-5" if unset. Same rule as STRATEGY_OPENAI_MODEL:
#                             change it here, never in code.)
#   STRATEGY_CLAUDE_MODEL_ECONOMY
#                            (optional — Claude's cheap tier, defaults to Haiku. Same role as
#                             STRATEGY_OPENAI_MODEL_ECONOMY above, for when a cheap-tier stage
#                             is running on Claude rather than OpenAI.)
#   SARVAM_API_KEY           (Sarvam AI batch speech-to-text, used by Loona Notes' meeting
#                             recorder — see netlify/functions/sarvam-*.js)
#   GOOGLE_CALENDAR_SERVICE_ACCOUNT   (full JSON key contents for the service account
#                             authorized for domain-wide delegation in Workspace Admin —
#                             see netlify/functions/calendar-sync.js. Also accepts the
#                             "GOOGLE_CALENDER_SERVICE_ACCOUNT" misspelling if that's
#                             what's actually set in the Netlify dashboard.
#                             Needs ALL FOUR of these scopes authorized for its Client ID
#                             in Workspace Admin > Security > API Controls > Domain-wide
#                             Delegation (add each one alongside the others, don't replace
#                             any of them):
#                               https://www.googleapis.com/auth/calendar.readonly
#                               https://www.googleapis.com/auth/calendar.events
#                               https://www.googleapis.com/auth/documents
