<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🇮🇳</text></svg>">
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #150602;
  }
  button { font: inherit; }
  .btn {
    border: none; border-radius: 999px; cursor: pointer; font-weight: 700;
    letter-spacing: .01em; -webkit-user-select: none; user-select: none;
  }
  .btn-primary {
    background: linear-gradient(135deg, #ff8a3d, #ff5a13);
    color: #1a0a02;
    box-shadow: 0 10px 30px rgba(255, 90, 19, .35);
  }
  .btn-secondary {
    background: rgba(255, 255, 255, .1);
    color: #fff;
    border: 1px solid rgba(255, 255, 255, .25);
  }
  .mic-logo {
    position: fixed; top: 20px; left: 50%; transform: translateX(-50%); z-index: 20;
    height: 26px; display: block;
    filter: drop-shadow(0 2px 8px rgba(0, 0, 0, .5));
  }

  /* ══════════ Scene (adapted from the Loona Hub dashboard's Independence
     Day page — same animation code, no dashboard chrome around it here, so
     it's simplified to position:fixed;inset:0 instead of the full-bleed
     vw-math the dashboard version needs to escape its padded parent). ══════════ */
  .ind-scene {
    position: fixed; inset: 0; overflow: hidden;
    background:
      radial-gradient(34% 22% at 6% 56%, rgba(255, 242, 216, .5) 0%, rgba(255, 150, 66, .26) 34%, transparent 60%),
      linear-gradient(178deg, #ff6d29 0%, #fb5713 16%, #db3d09 30%, #8f2605 46%, #3e0f02 64%, #150602 82%, #070301 100%);
  }
  .ind-sun {
    position: absolute; top: 20%; left: 38%; width: 13%; aspect-ratio: 1; border-radius: 50%;
    background: radial-gradient(circle at 40% 35%, #ffce7a 0%, #ff5a2b 55%, #d8280f 100%);
    animation: ind-sun-glow 3.4s ease-in-out infinite;
  }
  @keyframes ind-sun-glow {
    0%, 100% { box-shadow: 0 0 60px 10px rgba(255, 100, 40, .35); }
    50% { box-shadow: 0 0 90px 24px rgba(255, 150, 60, .6); }
  }
  .ind-fireworks { position: absolute; inset: 0; z-index: 1; pointer-events: none; overflow: hidden; }
  .ind-firework { position: absolute; }
  .ind-firework-flash {
    position: absolute; left: 50%; top: 50%; width: 10px; height: 10px; border-radius: 50%;
    transform: translate(-50%, -50%) scale(0);
    background: radial-gradient(circle, #fff 0%, var(--fw-color, #FFD54A) 55%, transparent 75%);
    box-shadow: 0 0 34px 12px var(--fw-color, #FFD54A);
    animation: ind-firework-flash .6s ease-out forwards;
  }
  @keyframes ind-firework-flash {
    0% { transform: translate(-50%, -50%) scale(0); opacity: 1; }
    35% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
    100% { transform: translate(-50%, -50%) scale(1.6); opacity: 0; }
  }
  .ind-firework-particle {
    position: absolute; left: 50%; top: 50%; width: 5px; height: 5px; border-radius: 50%;
    opacity: 0; will-change: transform, opacity;
    animation-name: ind-firework-particle; animation-timing-function: cubic-bezier(.15, .6, .4, 1);
    animation-fill-mode: forwards;
  }
  @keyframes ind-firework-particle {
    0% { transform: translate(-50%, -50%) rotate(var(--angle)) translateX(0); opacity: 1; }
    75% { opacity: .9; }
    100% { transform: translate(-50%, -50%) rotate(var(--angle)) translateX(var(--fw-dist, 60px)); opacity: 0; }
  }
  .ind-birds { position: absolute; inset: 0; z-index: 6; pointer-events: none; }
  .ind-bird {
    position: absolute; font-size: 15px; opacity: .85;
    animation-name: ind-bird-fly; animation-timing-function: ease-in-out;
    animation-iteration-count: infinite; animation-direction: alternate;
    filter: drop-shadow(0 1px 2px rgba(0, 0, 0, .3));
  }
  @keyframes ind-bird-fly {
    0% { transform: translate(-42vw, 8px) scale(1); }
    50% { transform: translate(0vw, -20px) scale(1.05); }
    100% { transform: translate(42vw, 6px) scale(1); }
  }
  .ind-gate {
    position: absolute; right: 2%; bottom: 0; height: 68%; aspect-ratio: 300 / 280;
    color: #1a0d06; filter: drop-shadow(0 -2px 0 rgba(0, 0, 0, .1)); z-index: 1;
  }
  .ind-gate svg { display: block; width: 100%; height: 100%; overflow: hidden; }
  @media (max-width: 820px) {
    .ind-gate { height: 48%; right: 4%; aspect-ratio: 190 / 280; }
    .ind-sun { width: 22%; }
  }
  .ind-ground {
    position: absolute; left: 0; right: 0; bottom: 0; height: 28%; background: #0c0602;
    clip-path: polygon(0% 72%, 24% 6%, 48% 30%, 100% 14%, 100% 100%, 0% 100%);
    z-index: 2;
  }
  .ind-flagpole {
    position: absolute; left: 12%; bottom: 20%; width: 4px; height: 55%;
    display: flex; justify-content: center; z-index: 3;
  }
  .ind-pole {
    width: 4px; height: 100%;
    background: linear-gradient(90deg, #6b5a4a, #cbb89a, #6b5a4a); border-radius: 2px;
  }
  .ind-pole::before {
    content: ''; position: absolute; top: -6px; left: 50%; width: 10px; height: 10px;
    transform: translateX(-50%); background: #d4af37; border-radius: 50%;
    box-shadow: 0 0 8px rgba(212, 175, 55, .8);
  }
  /* Same class-toggle + CSS-transition approach as the dashboard's
     Independence Day page (not the hold-to-hoist rAF interaction this
     microsite used at first) — a single click auto-plays the climb, same
     as "Unfurl the Flag" on the hub. */
  .ind-flag-wrap {
    position: absolute; left: 2px; bottom: 4%; width: 84px; height: 56px;
    transform-origin: left center; transform: scaleX(.12) scaleY(.55); opacity: .92;
    transition: bottom 7.5s cubic-bezier(.3, .68, .32, 1), transform 1.2s cubic-bezier(.34, 1.4, .5, 1) .1s;
  }
  .ind-flag-wrap.ind-hoisting { bottom: 88%; }
  .ind-flag-wrap.ind-unfurled { transform: scaleX(1) scaleY(1); }
  .ind-flag-inner { width: 100%; height: 100%; }
  .ind-flag-wrap.ind-unfurled .ind-flag-inner { animation: ind-wave 2.3s ease-in-out infinite; transform-origin: left center; }
  @keyframes ind-wave {
    0%, 100% { transform: skewY(0deg) scaleY(1); }
    50% { transform: skewY(-4deg) scaleY(.97); }
  }
  .ind-flag-svg { width: 100%; height: 100%; display: block; }
  .ind-jets { position: absolute; inset: 0; overflow: hidden; pointer-events: none; z-index: 6; }
  /* translate(), not offset-path — offset-path/offset-distance support is
     spottier in the in-app WebViews this microsite gets opened in from a
     shared link (vs. a full modern desktop/mobile browser for the
     dashboard), and silently not rendering at all is a worse failure mode
     than losing the wavy-swirl flourish. Straight diagonal pass instead,
     same technique this used before the swirl was added. */
  .ind-jet-art {
    position: absolute; top: 0; left: 0;
    filter: drop-shadow(0 2px 6px rgba(0, 0, 0, .3));
    animation-name: ind-jet-art-fly; animation-timing-function: linear;
    /* "both", not "forwards" — the second jet has a delay before it starts,
       and "forwards" only holds the *end* state, so during that delay the
       browser was rendering it at its plain un-animated CSS position
       (top:0;left:0, fully opaque) — a whole extra formation sitting frozen
       in the corner until its animation kicked in. "both" also applies the
       0% keyframe (invisible, off-screen) during the delay. */
    animation-fill-mode: both;
  }
  @keyframes ind-jet-art-fly {
    0% { transform: translate(var(--jf-x0), var(--jf-y0)) rotate(var(--jf-rot, 0deg)) scaleX(var(--jf-flip, 1)); opacity: 0; }
    8% { opacity: 1; }
    88% { opacity: 1; }
    100% { transform: translate(var(--jf-x1), var(--jf-y1)) rotate(var(--jf-rot, 0deg)) scaleX(var(--jf-flip, 1)); opacity: 0; }
  }
  .ind-petals { position: absolute; inset: 0; pointer-events: none; overflow: hidden; z-index: 6; }
  .ind-petal {
    position: absolute; top: -8%;
    animation-name: ind-petal-fall; animation-timing-function: ease-in; animation-fill-mode: forwards;
    will-change: transform, opacity;
  }
  @keyframes ind-petal-fall {
    0% { transform: translateY(0) translateX(0) rotate(0deg); opacity: 0; }
    10% { opacity: 1; }
    55% { transform: translateY(calc(var(--petal-fall, 400px) * .58)) translateX(20px) rotate(160deg); }
    92% { opacity: 1; }
    100% { transform: translateY(var(--petal-fall, 400px)) translateX(-14px) rotate(320deg); opacity: 0; }
  }

  /* ══════════ Microsite-specific UI (landing / share panels) ══════════ */
  .mic-controls {
    position: absolute; left: 0; right: 0; bottom: 0; z-index: 6;
    display: flex; flex-direction: column; align-items: center; gap: 8px;
    padding: 28px 20px calc(38px + env(safe-area-inset-bottom, 0px));
    text-align: center;
    background: linear-gradient(180deg, transparent 0%, rgba(7, 3, 1, .55) 40%, rgba(7, 3, 1, .9) 100%);
  }
  .mic-referred { font-size: 12px; color: #ffd54a; font-weight: 600; margin-bottom: 2px; }
  .mic-title { font-size: 20px; font-weight: 800; color: #fff; text-shadow: 0 2px 8px rgba(0, 0, 0, .5); margin: 0; }
  .mic-sub { font-size: 9.8px; color: rgba(255, 255, 255, .82); margin: 6px 0 8px; max-width: none; white-space: nowrap; }
  .mic-count { font-size: 11.5px; color: rgba(255, 255, 255, .65); margin: 8px 0 0; min-height: 16px; }
  .mic-hoist-btn { padding: 13px 30px; font-size: 14px; margin-top: 16px; }
  .mic-hoist-btn:disabled { opacity: .75; cursor: default; }
  .mic-share-actions { display: flex; gap: 10px; margin-top: 8px; flex-wrap: wrap; justify-content: center; }
  .mic-share-actions .btn { padding: 13px 24px; font-size: 14px; }
  .mic-share-status { font-size: 12.5px; color: #ffd54a; max-width: 320px; margin-top: 4px; min-height: 16px; line-height: 1.4; }
  .mic-name-row { display: flex; gap: 6px; align-items: center; margin-top: 4px; }
  .mic-name-row input {
    background: rgba(255, 255, 255, .1); border: 1px solid rgba(255, 255, 255, .25); border-radius: 999px;
    color: #fff; padding: 8px 14px; font-size: 13px; width: 170px; text-align: center; outline: none;
  }
  .mic-name-row input::placeholder { color: rgba(255, 255, 255, .5); }
  .mic-name-row input:focus { border-color: #ff9457; }

  /* No buttons while the map first shows — a clean, unobstructed reveal.
     The share/hoist-again controls appear as a popup 6s after the map
     itself appears (see the setTimeout in startClimb()), not immediately
     and not inline in the bottom panel. */
  .mic-modal-backdrop {
    position: fixed; inset: 0; z-index: 30;
    background: rgba(5, 2, 1, .6);
    display: flex; align-items: center; justify-content: center;
    padding: 20px calc(20px + env(safe-area-inset-right, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) calc(20px + env(safe-area-inset-left, 0px));
    animation: mic-backdrop-in .25s ease both;
  }
  @keyframes mic-backdrop-in { from { opacity: 0; } to { opacity: 1; } }
  .mic-modal-card {
    background: linear-gradient(165deg, #1a0d06, #0c0502);
    border: 1px solid rgba(255, 255, 255, .12);
    border-radius: 22px;
    padding: 26px 26px calc(24px + env(safe-area-inset-bottom, 0px));
    max-width: 340px; width: 100%;
    text-align: center;
    box-shadow: 0 30px 80px rgba(0, 0, 0, .5);
    display: flex; flex-direction: column; align-items: center; gap: 8px;
    animation: mic-card-in .35s cubic-bezier(.2, .9, .3, 1.2) both;
  }
  @keyframes mic-card-in { from { opacity: 0; transform: scale(.85) translateY(14px); } to { opacity: 1; transform: scale(1) translateY(0); } }

  /* India map reveal — lives directly IN the scene (no modal/backdrop
     dimming everything else). A commissioned hi-res illustration (sky,
     sun, and the state-boundary map pre-rendered as one piece) fades/
     scales in over the still-live scene. The gate/flagpole/ground fade
     out since there's no room for them once the map takes over — but the
     live sun and its gradient sky stay exactly as they were on the hoist
     screen, showing through/behind the map, and jets/petals/birds keep
     animating over the top too, since the illustration doesn't include
     any of that itself. */
  .ind-gate, .ind-flagpole, .ind-ground { transition: opacity .9s ease; }
  .ind-scene.ind-scene-celebrating .ind-gate,
  .ind-scene.ind-scene-celebrating .ind-flagpole,
  .ind-scene.ind-scene-celebrating .ind-ground { opacity: 0; }
  /* Sized to the illustration's own aspect ratio (1080x1920) via
     aspect-ratio + a width capped by viewport height, same technique the
     source design uses for its "stage" — guarantees the image is never
     cropped, which matters because the live heat-spot markers below are
     positioned as percentages of this exact box to line up with the
     artwork's actual pixel content. */
  .ind-map-screen {
    position: absolute; left: 50%; top: 50%; z-index: 5;
    width: min(100%, calc(100dvh * 0.5625));
    aspect-ratio: 1080 / 1920;
    max-height: 100%;
    transform: translate(-50%, -50%) scale(1);
    opacity: 0; pointer-events: none;
    transition: opacity 1.1s ease .15s, transform 1.1s cubic-bezier(.22, .8, .28, 1.05) .15s;
  }
  /* Back to filling the box exactly (no reserved caption headroom, which
     made the map visibly smaller/boxed-in) — the caption now overlays the
     image's own dark lower margin instead of taking extra layout space
     (see .ind-map-caption below), so this can go back to sizing exactly
     like it did before the caption existed. */
  .ind-map-imgwrap { position: relative; width: 100%; height: 100%; }
  /* Rests at an exact, uncropped fit (scale 1) — a bigger overshoot
     (previously 1.22) was tried, but the map's own side margins are only
     ~8-10%, so scaling past ~1.1 crops straight into the landmass on
     phones narrower than the image's own 9:16 ratio (most of them). It
     also likely compounded with iOS Safari's 100dvh sometimes shifting
     mid-transition (its toolbar auto-hides/shows), which would explain
     both the cropping AND the you-marker landing in the wrong spot on a
     real device despite both being correct in every desktop/emulated
     test — everything inside this box is positioned relative to its
     actual rendered geometry, so if that box drifts, so does the marker. */
  .ind-scene.ind-scene-celebrating .ind-map-screen { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  .ind-map-bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: fill; display: block; user-select: none; pointer-events: none; }
  /* Overlaid on the image's own dark bottom margin (the landmass ends
     around 80% down; this sits well below that) instead of taking extra
     space below the image, so the map itself renders at full size. */
  .ind-map-caption { position: absolute; left: 0; right: 0; bottom: 5%; padding: 0 20px; text-align: center; }
  .ind-map-caption-sanskrit { font-size: 14px; font-weight: 600; color: #ffe6b3; text-shadow: 0 2px 8px rgba(0, 0, 0, .6); margin-bottom: 4px; line-height: 1.4; }
  .ind-map-caption-en { font-size: 11.5px; color: rgba(255, 255, 255, .78); text-shadow: 0 1px 4px rgba(0, 0, 0, .6); }

  /* Commissioned illustration (assets/independence-day/celebration-map.jpg)
     — a pre-rendered raster now, not the earlier live SVG-loaded-as-<img>,
     so there's no dependency on the viewer's browser supporting SVG
     filters (blur/drop-shadow) inside an externally-loaded image — some
     mobile browsers render those inconsistently or not at all, which was
     the likely cause of the map silently failing for some visitors. Live
     heat-spot markers are positioned as percentages calibrated against
     this exact image (verified against ~13 known cities, e.g. Mumbai
     lands right on the coast where it belongs). See projectToMapXY() in
     the script for the same math. Swapping to a differently-composed
     image needs the calibration redone. */
  .ind-map-dots { position: absolute; inset: 0; }
  /* Soft blinking heatmap-style glow spots (radial gradient, blurred
     edges), not pins — saffron and green, alternating per hoist. */
  .ind-map-spot {
    position: absolute; width: 9px; height: 9px;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    filter: blur(.5px);
    animation: ind-map-spot-blink 2.2s ease-in-out infinite;
  }
  .ind-map-spot-orange { background: radial-gradient(circle, rgba(255, 153, 51, .95) 0%, rgba(255, 153, 51, .45) 45%, transparent 72%); }
  .ind-map-spot-green { background: radial-gradient(circle, rgba(19, 136, 8, .95) 0%, rgba(19, 136, 8, .45) 45%, transparent 72%); animation-delay: 1.1s; }
  @keyframes ind-map-spot-blink { 0%, 100% { opacity: .4; transform: translate(-50%, -50%) scale(.7); } 50% { opacity: 1; transform: translate(-50%, -50%) scale(1.2); } }
  /* The hoister's own marker — a small flag + ripple rings + city-name
     label (mumbai_marker_asset_combined.svg), not a blinking dot like the
     others. Positioned so the SVG's own ripple-ring anchor point (66,130
     in its 260x210 viewBox) lands exactly on the calculated lat/lon spot —
     translate() is that anchor as a % of the element's own box. */
  .ind-map-you-marker {
    position: absolute; width: 100px; aspect-ratio: 260 / 210;
    transform: translate(-25.4%, -61.9%);
    pointer-events: none;
    animation: ind-you-marker-pulse 1.8s ease-in-out infinite;
  }
  .ind-map-you-marker svg { width: 100%; height: 100%; display: block; overflow: visible; }
  @keyframes ind-you-marker-pulse {
    0%, 100% { filter: drop-shadow(0 0 4px rgba(255, 180, 60, .5)); }
    50% { filter: drop-shadow(0 0 10px rgba(255, 180, 60, .9)); }
  }
</style>

<script>
// The dashboard (index.html) registers /sw.js with the default (root)
// scope, which makes it control EVERY page on this origin — including
// this microsite, even though this page never registers it itself —
// for any visitor whose browser previously loaded the dashboard. Its
// fetch handler is network-first, but a service worker still means one
// more layer (on top of the browser's own HTTP cache and any CDN
// caching) that can end up serving something other than exactly what
// was just deployed, especially after a flaky mobile connection blip
// falls back to a cached copy. This microsite has no legitimate need
// for offline caching, so it explicitly unregisters any controller
// rather than relying on it to always behave — belt-and-suspenders
// alongside the cache-busting ?v= on the jets/audio asset URLs below.
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.getRegistrations()
    .then(regs => regs.forEach(r => r.unregister()))
    .catch(() => {});
}

(function buildChakraSpokes() {
  const g = document.getElementById('ind-chakra');
  if (!g) return;
  const NS = 'http://www.w3.org/2000/svg';
  for (let i = 0; i < 24; i++) {
    const line = document.createElementNS(NS, 'line');
    line.setAttribute('x1', '0'); line.setAttribute('y1', '0');
    line.setAttribute('x2', '0'); line.setAttribute('y2', '-11');
    line.setAttribute('stroke', '#0000AA');
    line.setAttribute('stroke-width', '0.7');
    line.setAttribute('transform', 'rotate(' + (i * 15) + ')');
    g.appendChild(line);
  }
})();

// Mobile: swap the gate SVG to a "cover"/cropped fit so it can go taller
// without its width ballooning at the same rate — same technique as the
// dashboard's Independence Day page (see index.html's
// applyIndGateResponsiveCrop for the full rationale).
function applyIndGateResponsiveCrop() {
  const gate = document.querySelector('.ind-gate');
  const svg = gate ? gate.querySelector('svg') : null;
  if (!gate || !svg) return;
  const isMobile = window.matchMedia('(max-width: 820px)').matches;
  svg.setAttribute('preserveAspectRatio', isMobile ? 'xMidYMax slice' : 'xMidYMax meet');
}
applyIndGateResponsiveCrop();
window.addEventListener('resize', applyIndGateResponsiveCrop);

// ── Jet flypast — a simpler straight diagonal pass (CSS custom properties
// + translate(), not the dashboard's offset-path-driven wavy swirl) since
// offset-path support is spottier in the in-app WebViews a shared link
// tends to get opened in, and a jet that silently never renders is a worse
// failure than a jet that flies a straight line instead of a curve.
// Fireworks and petals below ARE unchanged from the dashboard.
// Cancels a container's own previously-scheduled cleanup (if any) before
// clearing it and scheduling a new one. Without this, "Hoist Again" fired
// quickly enough that a second spawn call lands just before the FIRST
// call's cleanup timer fires — that stale timer still does an unconditional
// `container.innerHTML = ''`, wiping out the second call's freshly-added
// content a moment after it appeared (confirmed via a Playwright test that
// deliberately hoists twice in a row: jets rendered fine on the first
// hoist, came back empty on the second).
function scheduleCleanup(container, delay) {
  if (container._cleanupTimer) clearTimeout(container._cleanupTimer);
  container._cleanupTimer = setTimeout(() => {
    if (container) container.innerHTML = '';
    container._cleanupTimer = null;
  }, delay);
}
function spawnJets(container) {
  if (!container) return;
  if (container._cleanupTimer) clearTimeout(container._cleanupTimer);
  container.innerHTML = '';
  const rect = container.getBoundingClientRect();
  const W = Math.max(1, rect.width), H = Math.max(1, rect.height);
  const imgW = Math.max(190, Math.min(400, W * 0.28));
  const imgH = imgW; // jets-formation.svg's viewBox is square (1200x1200)
  // Both paths stay within the top ~quarter of the screen — the hoisted
  // flag settles around 32% down (see .ind-flagpole/.ind-hoisting math), so
  // anything lower reads as flying below/level with the flag instead of a
  // flypast streaking through the sky above it.
  const instances = [
    // Natural orientation: bottom-left -> top-right, nose pointing right.
    { flip: 1, rot: 48.3, duration: 7.5, delay: 0,
      x0: -imgW * 0.7, y0: H * 0.22, x1: W + imgW * 0.1, y1: -imgH * 0.75 },
    // Mirrored: bottom-right -> top-left, nose pointing left. Starts
    // together with the first (no delay — even 0.4s still read as late),
    // and flattened out: more horizontal travel across to the left, less
    // steep climb, so it doesn't read as shooting straight up.
    { flip: -1, rot: -27, duration: 7.8, delay: 0,
      x0: W + imgW * 0.7, y0: H * 0.16, x1: -imgW * 1.3, y1: -imgH * 0.35 }
  ];
  instances.forEach(inst => {
    const img = document.createElement('img');
    img.className = 'ind-jet-art';
    img.src = '/assets/independence-day/jets-formation.svg?v=2';
    img.alt = '';
    img.style.width = imgW + 'px';
    img.style.height = imgH + 'px';
    img.style.animationDuration = inst.duration + 's';
    img.style.animationDelay = inst.delay + 's';
    img.style.setProperty('--jf-flip', inst.flip);
    img.style.setProperty('--jf-rot', inst.rot + 'deg');
    img.style.setProperty('--jf-x0', inst.x0.toFixed(1) + 'px');
    img.style.setProperty('--jf-y0', inst.y0.toFixed(1) + 'px');
    img.style.setProperty('--jf-x1', inst.x1.toFixed(1) + 'px');
    img.style.setProperty('--jf-y1', inst.y1.toFixed(1) + 'px');
    container.appendChild(img);
  });
  const maxLife = Math.max(...instances.map(i => i.duration + i.delay)) * 1000 + 400;
  scheduleCleanup(container, maxLife);
}
function spawnFireworks(container) {
  if (!container) return;
  if (container._cleanupTimer) clearTimeout(container._cleanupTimer);
  container.innerHTML = '';
  const colors = ['#FFFFFF', '#138808', '#FFD54A', '#29B6F6'];
  const burstCount = 8;
  let maxLife = 0;
  for (let i = 0; i < burstCount; i++) {
    const delay = i === 0 ? 0 : i * 700 + Math.random() * 350;
    const left = 10 + Math.random() * 78;
    const top = 6 + Math.random() * 32;
    const color = colors[Math.floor(Math.random() * colors.length)];
    const particleCount = 16 + Math.floor(Math.random() * 6);
    const dist = 52 + Math.random() * 36;
    const duration = 1.1 + Math.random() * .5;
    setTimeout(() => {
      if (!container.isConnected) return;
      const fw = document.createElement('div');
      fw.className = 'ind-firework';
      fw.style.left = left + '%';
      fw.style.top = top + '%';
      fw.style.setProperty('--fw-color', color);
      const flash = document.createElement('div');
      flash.className = 'ind-firework-flash';
      fw.appendChild(flash);
      for (let p = 0; p < particleCount; p++) {
        const particle = document.createElement('span');
        particle.className = 'ind-firework-particle';
        particle.style.setProperty('--angle', (p * (360 / particleCount) + Math.random() * 10) + 'deg');
        particle.style.setProperty('--fw-dist', dist + 'px');
        particle.style.background = color;
        particle.style.boxShadow = '0 0 8px 2px ' + color;
        particle.style.animationDuration = duration + 's';
        fw.appendChild(particle);
      }
      container.appendChild(fw);
      setTimeout(() => { if (fw.parentNode) fw.parentNode.removeChild(fw); }, duration * 1000 + 200);
    }, delay);
    maxLife = Math.max(maxLife, delay + duration * 1000 + 300);
  }
  scheduleCleanup(container, maxLife + 200);
}
function spawnPetals(container) {
  if (!container) return;
  if (container._cleanupTimer) clearTimeout(container._cleanupTimer);
  container.innerHTML = '';
  const fallPx = Math.max(300, container.getBoundingClientRect().height) * 1.1;
  container.style.setProperty('--petal-fall', fallPx + 'px');
  const emojis = ['🌸', '🌼', '🏵️', '🌺'];
  for (let i = 0; i < 34; i++) {
    const p = document.createElement('span');
    p.className = 'ind-petal';
    p.textContent = emojis[Math.floor(Math.random() * emojis.length)];
    p.style.left = Math.random() * 100 + '%';
    p.style.fontSize = (11 + Math.random() * 9) + 'px';
    p.style.animationDuration = (3.6 + Math.random() * 2.4) + 's';
    p.style.animationDelay = (Math.random() * 1.4) + 's';
    container.appendChild(p);
  }
  scheduleCleanup(container, 8000);
}
function playVandeMataram() {
  const audio = document.getElementById('ind-vande-mataram');
  if (!audio) return;
  try {
    audio.currentTime = 0;
    const p = audio.play();
    if (p && p.catch) p.catch(() => {});

}

const params = new URLSearchParams(location.search);
const referrerSlug = params.get('from');

function unslug(s) {
  return s.replace(/-/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
}
if (referrerSlug) {
  const el = document.getElementById('referred-line');
  el.style.display = '';
  el.textContent = unslug(referrerSlug) + ' hoisted the flag 🇮🇳 Now it\'s your turn.';
}

function slugify(s) {
  return s.toLowerCase().trim().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 24);
}
function randomSlug() {
  const adjectives = ['bold', 'swift', 'proud', 'free', 'brave', 'bright', 'united', 'fearless'];
  const a = adjectives[Math.floor(Math.random() * adjectives.length)];
  return a + '-loonatic-' + Math.floor(1000 + Math.random() * 9000);
}
let mySlug = randomSlug();

const HOIST_ENDPOINT = '/.netlify/functions/independence-hoist';

// Polls rather than fetching once — this number keeps changing as other
// people hoist while a visitor is sitting on the landing screen, so it
// should visibly update live instead of only reflecting the count as of
// whenever this particular visitor's page happened to load.
function refreshDailyCount() {
  fetch(HOIST_ENDPOINT).then(r => r.json()).then(d => {
    const el = document.getElementById('daily-count-line');
    el.textContent = d.count > 0 ? d.count.toLocaleString() + ' flag' + (d.count === 1 ? '' : 's') + ' hoisted today with Loona' : '';

}

// celebration-map.jpg is a separate export of the same India-outline
// artwork, but NOT pixel-identical to the SVG this was first calibrated
// against — two prior attempts assumed it was (carrying the SVG's known
// transform forward, then re-guessing 4 tip landmarks by eye) and both
// were confirmed wrong by user screenshots (own marker landing inland /
// in the wrong state). This version doesn't guess at all: it renders the
// original vector SVG at the same 1080x1920 size, auto-detects the
// outline's bounding box in both that render and the actual JPEG (bright
// yellow/gold pixels, sun region masked out), and measures the real
// scale+offset between them (JPEG lands ~11-14% bigger and shifted down/
// right). The already-vector-exact SVG-space formula is computed first,
// then run through that measured correction — verified against 17 known
// cities landing correctly on the actual JPEG pixels (Mumbai on the
// coast, Port Blair on the Andamans, etc). If celebration-map.jpg is ever
// replaced, redo the bbox measurement (see calibrate-v4.js in this
// session's scratchpad for the method) — don't just reuse these numbers.
function projectToMapXY(lat, lon) {
  // Vector-exact position in the original SVG's 1080x1920 space.
  const mapX = 99.9 + (lon - 68.0) / (97.4 - 68.0) * 800.2;
  const mapY = 45.5 + (37.6 - lat) / (37.6 - 6.5) * 909.0;
  const svgX = 1.10 * mapX - 18;
  const svgY = 1.06 * mapY + 262;
  // Measured correction from that SVG render's pixels to the actual JPEG's.
  const svgX0 = 91, svgY0 = 309, jpgX0 = 70, jpgY0 = 431;
  const scaleX = 978 / 881, scaleY = 1099 / 964;
  const canvasX = jpgX0 + (svgX - svgX0) * scaleX;
  const canvasY = jpgY0 + (svgY - svgY0) * scaleY;
  return { x: canvasX / 1080 * 100, y: canvasY / 1920 * 100 };
}

// A soft blinking heatmap-style glow spot (radial gradient blob) —
// positions are percentages of the .ind-map-imgwrap box (aspect-ratio
// locked to celebration-map.jpg's own 1080x1920, so these line up with
// the art regardless of .ind-map-screen's own size, which now also
// includes the caption below the image).
function mapSpotHTML(xPct, yPct, cls) {
  return '<div class="' + cls + '" style="left:' + xPct + '%;top:' + yPct + '%"></div>';
}

// The hoister's own marker — small flag + ripple rings + city-name label
// (from mumbai_marker_asset_combined.svg), not a blinking dot. Falls back
// to "Your flag" when the geo lookup didn't come back with a city name.

    '<svg viewBox="0 0 260 210" xmlns="http://www.w3.org/2000/svg">' +
    '<defs>' +
    '<filter id="youSoftGlow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="3.2" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>' +
    '<filter id="youLabelShadow" x="-50%" y="-50%" width="200%" height="200%"><feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.35"/></filter>' +
    '<linearGradient id="youPoleGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#D7D7D7"/><stop offset="100%" stop-color="#9A9A9A"/></linearGradient>' +
    '<radialGradient id="youSunDot" cx="50%" cy="50%" r="50%"><stop offset="0%" stop-color="#FFF2C0"/><stop offset="100%" stop-color="#F4B251"/></radialGradient>' +
    '</defs>' +
    '<g transform="translate(66 130)">' +
    '<circle cx="0" cy="0" r="8.5" fill="url(#youSunDot)" filter="url(#youSoftGlow)"/>' +
    '<circle cx="0" cy="0" r="16" fill="none" stroke="#F39D38" stroke-opacity="0.75" stroke-width="1.8"/>' +
    '<circle cx="0" cy="0" r="26" fill="none" stroke="#F39D38" stroke-opacity="0.45" stroke-width="1.6"/>' +
    '<circle cx="0" cy="0" r="36" fill="none" stroke="#F39D38" stroke-opacity="0.24" stroke-width="1.4"/>' +
    '</g>' +
    '<g transform="translate(58 78)">' +
    '<rect x="0" y="0" width="3.2" height="54" rx="1.6" fill="url(#youPoleGrad)"/>' +
    '<circle cx="1.6" cy="0.6" r="3.6" fill="#E6C869"/>' +
    '<g transform="translate(3.5 4)">' +
    '<rect x="0" y="0" width="46" height="28" rx="1.3" fill="#FFFFFF"/>' +
    '<rect x="0" y="0" width="46" height="9.333" rx="1.3" fill="#F7931E"/>' +
    '<rect x="0" y="18.667" width="46" height="9.333" fill="#138A36"/>' +
    '<circle cx="23" cy="14" r="4.4" fill="none" stroke="#273C9B" stroke-width="1.3"/>' +
    '<circle cx="23" cy="14" r="0.85" fill="#273C9B"/>' +
    '<g stroke="#273C9B" stroke-width="0.6" stroke-linecap="round" transform="translate(23 14)">' +
    '<line x1="0" y1="-4" x2="0" y2="-2.1"/><line x1="2.00" y1="-3.46" x2="1.05" y2="-1.82"/>' +
    '<line x1="3.46" y1="-2.00" x2="1.82" y2="-1.05"/><line x1="4" y1="0" x2="2.1" y2="0"/>' +
    '<line x1="3.46" y1="2.00" x2="1.82" y2="1.05"/><line x1="2.00" y1="3.46" x2="1.05" y2="1.82"/>' +
    '<line x1="0" y1="4" x2="0" y2="2.1"/><line x1="-2.00" y1="3.46" x2="-1.05" y2="1.82"/>' +
    '<line x1="-3.46" y1="2.00" x2="-1.82" y2="1.05"/><line x1="-4" y1="0" x2="-2.1" y2="0"/>' +
    '<line x1="-3.46" y1="-2.00" x2="-1.82" y2="-1.05"/><line x1="-2.00" y1="-3.46" x2="-1.05" y2="-1.82"/>' +
    '</g>' +
    '<rect x="0" y="0" width="46" height="28" rx="1.3" fill="none" stroke="rgba(0,0,0,0.12)" stroke-width="0.8"/>' +
    '</g>' +
    '</g>' +
    '<g filter="url(#youLabelShadow)">' +
    '<rect x="' + boxX + '" y="154" width="' + labelWidth + '" height="28" rx="7.5" fill="#5A2B19" fill-opacity="0.9" stroke="#C88547" stroke-width="1.2"/>' +
    '<text x="' + (boxX + labelWidth / 2) + '" y="172.5" text-anchor="middle" font-family="Inter, Arial, Helvetica, sans-serif" font-size="15" font-weight="500" fill="#FFF7EA">' + label + '</text>' +
    '</g>' +
    '</svg></div>';
}

function renderMap(data) {
  const dotsWrap = document.getElementById('ind-map-dots');
  if (!dotsWrap || !data) return;

  const spotClasses = ['ind-map-spot ind-map-spot-orange', 'ind-map-spot ind-map-spot-green'];
  let html = '';
  (data.dots || []).forEach((d, i) => {
    const p = projectToMapXY(d.lat, d.lon);
    html += mapSpotHTML(p.x, p.y, spotClasses[i % 2]);
  });
  if (data.dot) {
    const p = projectToMapXY(data.dot.lat, data.dot.lon);
    html += mapYouMarkerHTML(p.x, p.y, data.dot.city);
  }
  dotsWrap.innerHTML = html;
}

let lastHoistResult = null;
function recordHoist() {
  // Still records the hoist (daily count + referral log) even though the
  // popup only shows "Happy Independence Day" now, not a rank sentence —
  // keeps the "X flags hoisted today" line on landing accurate for the
  // next visitor. Also fetches the map data (this hoist's own approximate
  // location plus recent others') for the celebration screen's India map.
  return fetch(HOIST_ENDPOINT, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ from: referrerSlug || null })
  }).then(r => r.json()).then(d => { lastHoistResult = d; return d; }).catch(() => null);
}

// ── Hoist on click, same as the dashboard's "Unfurl the Flag" button ──
// A single click auto-plays the whole climb via the CSS class-toggle +
// transition approach (see .ind-flag-wrap), not a held-down gesture.
const wrap = document.getElementById('ind-flag-wrap');
const hoistBtn = document.getElementById('hoist-btn');
const hoistLabel = document.getElementById('hoist-btn-label');
let jetsLoopInterval = null;
const climbDuration = 7.5;

function startClimb() {
  hoistBtn.disabled = true;
  hoistLabel.textContent = 'Jai Hind';
  wrap.style.transition = 'bottom ' + climbDuration.toFixed(2) + 's cubic-bezier(.3, .68, .32, 1), transform 1.2s cubic-bezier(.34, 1.4, .5, 1) .1s';
  wrap.classList.remove('ind-hoisting', 'ind-unfurled');
  void wrap.offsetWidth; // force reflow so replaying restarts the transition from the bottom
  wrap.classList.add('ind-hoisting');
  playVandeMataram();
  setTimeout(() => {
    wrap.classList.add('ind-unfurled');
    spawnPetals(document.getElementById('ind-petals'));
    spawnJets(document.getElementById('ind-jets'));
    spawnFireworks(document.getElementById('ind-fireworks'));
    const hoistPromise = recordHoist();
    // The camera "pans out" right as the jets finish crossing the screen
    // (their longest flight + delay is 7.8s from this point — see
    // spawnJets) — the India Gate, flagpole, and ground fade out and the
    // map fades/scales in to fill the page over the same live sky/sun/
    // petals, so it reads as one continuous pull-back to the national
    // scale timed to the flypast finishing, not an arbitrary wait.
    const jetsDoneAt = 7800;
    setTimeout(() => {
      document.getElementById('ind-scene').classList.add('ind-scene-celebrating');
      // Jets keep flying on top of the map once it's showing, not just the
      // one flypast before it — re-spawn on a loop for as long as the
      // celebration is up. z-index already puts .ind-jets (6) above
      // .ind-map-screen (5) so they visibly cross over the map.
      if (jetsLoopInterval) clearInterval(jetsLoopInterval);
      jetsLoopInterval = setInterval(() => {
        spawnJets(document.getElementById('ind-jets'));
      }, 9000);
    }, jetsDoneAt);
    setTimeout(() => {
      document.getElementById('phase-landing').style.display = 'none';
      document.getElementById('phase-celebrate').style.display = '';
      hoistPromise.then((d) => renderMap(d || lastHoistResult));
      prepareStoryAssets();
      // Map shows clean first, no buttons — the share/hoist-again popup
      // appears 6s later rather than being there immediately.
      setTimeout(() => {
        document.getElementById('share-modal').style.display = 'flex';
      }, 6000);
    }, jetsDoneAt + 1300);
  }, climbDuration * 1000);
}
hoistBtn.addEventListener('click', () => {
  if (hoistBtn.disabled) return;
  startClimb();
});

document.getElementById('again-btn').addEventListener('click', () => {
  // Same quick-drop-then-climb-again as the dashboard's "Hoist Again" —
  // a real, visible drop (short transition) before the slow climb restarts,
  // rather than silently snapping back to the bottom.
  document.getElementById('phase-celebrate').style.display = 'none';
  document.getElementById('share-modal').style.display = 'none';
  document.getElementById('phase-landing').style.display = '';
  document.getElementById('ind-scene').classList.remove('ind-scene-celebrating');
  if (jetsLoopInterval) { clearInterval(jetsLoopInterval); jetsLoopInterval = null; }
  hoistBtn.disabled = true;
  const dropDuration = .5;
  hoistLabel.textContent = 'Lowering…';
  wrap.style.transition = 'bottom ' + dropDuration + 's ease-in, transform ' + dropDuration + 's ease-in';
  wrap.classList.remove('ind-hoisting', 'ind-unfurled');
  setTimeout(() => { hoistBtn.disabled = false; startClimb(); }, dropDuration * 1000 + 60);
});

// ── Name -> personalized referral link, and the shareable Story image ──
const nameInput = document.getElementById('name-input');
nameInput.addEventListener('input', () => {
  mySlug = slugify(nameInput.value) || randomSlug();
  prepareStoryAssets();
});

function shareUrl() {
  return location.origin + '/independence/?from=' + encodeURIComponent(mySlug);
}

let latestStoryBlob = null;
function prepareStoryAssets() {
  buildStoryImage(shareUrl(), blob => { latestStoryBlob = blob; });
}

// Draws a 1080x1920 (Story-ratio) branded card: "I HOISTED THE FLAG 🇮🇳 /
// Your turn. / <url>" plus a QR code, instead of sharing a generic "Happy
// Independence Day" image — the whole point (per the brief) is that what
// gets shared is itself an invitation with the link baked in, not just a
// nice graphic, so the chain can actually continue when someone sees it.
function buildStoryImage(url, callback) {
  const canvas = document.getElementById('story-canvas');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;

  const grad = ctx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, '#ff7a30');
  grad.addColorStop(.32, '#fb5713');
  grad.addColorStop(.6, '#8f2605');
  grad.addColorStop(1, '#150602');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);

  const stripeY = 150, stripeH = 22;
  ctx.fillStyle = '#FF9933'; ctx.fillRect(0, stripeY, W, stripeH);
  ctx.fillStyle = '#FFFFFF'; ctx.fillRect(0, stripeY + stripeH, W, stripeH);
  ctx.fillStyle = '#138808'; ctx.fillRect(0, stripeY + stripeH * 2, W, stripeH);

  ctx.textAlign = 'center';
  ctx.fillStyle = '#fff';
  ctx.font = '800 92px system-ui, -apple-system, sans-serif';
  ctx.fillText('I HOISTED', W / 2, 560);
  ctx.fillText('THE FLAG 🇮🇳', W / 2, 668);

  ctx.font = '600 48px system-ui, -apple-system, sans-serif';
  ctx.fillStyle = 'rgba(255,255,255,.9)';
  ctx.fillText('Your turn.', W / 2, 760);

  ctx.font = '600 30px system-ui, -apple-system, sans-serif';
  ctx.fillStyle = '#FFD54A';
  ctx.fillText(url.replace(/^https?:\/\//, ''), W / 2, 1770);

  const finish = () => canvas.toBlob(blob => callback(blob), 'image/png');

  const qr = new Image();
  qr.crossOrigin = 'anonymous';
  qr.onload = () => {
    const qs = 280;
    const qx = W / 2 - qs / 2, qy = 1400;
    ctx.fillStyle = '#fff';
    ctx.fillRect(qx - 18, qy - 18, qs + 36, qs + 36);
    ctx.drawImage(qr, qx, qy, qs, qs);
    finish();
  };
  qr.onerror = finish; // still produce a shareable image even if the QR API is unreachable
  qr.src = 'https://api.qrserver.com/v1/create-qr-code/?size=280x280&data=' + encodeURIComponent(url);
}

document.getElementById('share-btn').addEventListener('click', async () => {
  const status = document.getElementById('share-status');
  const url = shareUrl();
  const finish = async (blob) => {
    let shared = false;
    if (navigator.canShare && blob) {
      try {
        const file = new File([blob], 'loona-independence-hoist.png', { type: 'image/png' });
        if (navigator.canShare({ files: [file] })) {
          try { await navigator.clipboard.writeText(url); } catch (e) {}
          await navigator.share({ files: [file], title: 'I hoisted the flag 🇮🇳', text: 'Your turn: ' + url });
          shared = true;
        }
      } catch (e) { /* user cancelled the native share sheet, or share failed — fall through */ }
    }
    if (!shared) {
      if (blob) {
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'loona-independence-hoist.png';
        document.body.appendChild(a); a.click(); a.remove();
      }
      try { await navigator.clipboard.writeText(url); } catch (e) {}
    }
    status.textContent = 'Your Story is ready. Add a Link sticker and paste the link we copied for you.';
  };
  if (latestStoryBlob) finish(latestStoryBlob);
  else buildStoryImage(url, finish);
});
