<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #150602;
  }
  button { font: inherit; }

    letter-spacing: .01em; -webkit-user-select: none; user-select: none;
  }
  .btn-primary {
    background: linear-gradient(135deg, #ff8a3d, #ff5a13);
    color: #1a0a02;
    box-shadow: 0 10px 30px rgba(255, 90, 19, .35);
  }
  .btn-secondary {
    background: rgba(255, 255, 255, .1);
    color: #fff;
    border: 1px solid rgba(255, 255, 255, .25);
  }
  .mic-logo {
    position: fixed; top: 18px; left: 20px; z-index: 20;

    opacity: .9; text-shadow: 0 2px 8px rgba(0, 0, 0, .5);
  }

  /* ══════════ Scene (adapted from the Loona Hub dashboard's Independence
     Day page — same animation code, no dashboard chrome around it here, so
     it's simplified to position:fixed;inset:0 instead of the full-bleed
     vw-math the dashboard version needs to escape its padded parent). ══════════ */
  .ind-scene {
    position: fixed; inset: 0; overflow: hidden;
    background:
      radial-gradient(34% 22% at 6% 56%, rgba(255, 242, 216, .5) 0%, rgba(255, 150, 66, .26) 34%, transparent 60%),
      linear-gradient(178deg, #ff6d29 0%, #fb5713 16%, #db3d09 30%, #8f2605 46%, #3e0f02 64%, #150602 82%, #070301 100%);
  }
  .ind-sun {
    position: absolute; top: 20%; left: 38%; width: 13%; aspect-ratio: 1; border-radius: 50%;
    background: radial-gradient(circle at 40% 35%, #ffce7a 0%, #ff5a2b 55%, #d8280f 100%);
    animation: ind-sun-glow 3.4s ease-in-out infinite;
  }
  @keyframes ind-sun-glow {
    0%, 100% { box-shadow: 0 0 60px 10px rgba(255, 100, 40, .35); }
    50% { box-shadow: 0 0 90px 24px rgba(255, 150, 60, .6); }
  }
  .ind-fireworks { position: absolute; inset: 0; z-index: 1; pointer-events: none; overflow: hidden; }
  .ind-firework { position: absolute; }
  .ind-firework-flash {
    position: absolute; left: 50%; top: 50%; width: 10px; height: 10px; border-radius: 50%;
    transform: translate(-50%, -50%) scale(0);
    background: radial-gradient(circle, #fff 0%, var(--fw-color, #FFD54A) 55%, transparent 75%);
    box-shadow: 0 0 34px 12px var(--fw-color, #FFD54A);
    animation: ind-firework-flash .6s ease-out forwards;
  }
  @keyframes ind-firework-flash {
    0% { transform: translate(-50%, -50%) scale(0); opacity: 1; }
    35% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
    100% { transform: translate(-50%, -50%) scale(1.6); opacity: 0; }
  }
  .ind-firework-particle {
    position: absolute; left: 50%; top: 50%; width: 5px; height: 5px; border-radius: 50%;
    opacity: 0; will-change: transform, opacity;
    animation-name: ind-firework-particle; animation-timing-function: cubic-bezier(.15, .6, .4, 1);
    animation-fill-mode: forwards;
  }
  @keyframes ind-firework-particle {
    0% { transform: translate(-50%, -50%) rotate(var(--angle)) translateX(0); opacity: 1; }
    75% { opacity: .9; }
    100% { transform: translate(-50%, -50%) rotate(var(--angle)) translateX(var(--fw-dist, 60px)); opacity: 0; }
  }
  .ind-birds { position: absolute; inset: 0; z-index: 3; pointer-events: none; }
  .ind-bird {
    position: absolute; font-size: 15px; opacity: .85;
    animation-name: ind-bird-fly; animation-timing-function: ease-in-out;
    animation-iteration-count: infinite; animation-direction: alternate;
    filter: drop-shadow(0 1px 2px rgba(0, 0, 0, .3));
  }
  @keyframes ind-bird-fly {
    0% { transform: translate(-42vw, 8px) scale(1); }
    50% { transform: translate(0vw, -20px) scale(1.05); }
    100% { transform: translate(42vw, 6px) scale(1); }
  }
  .ind-gate {
    position: absolute; right: 2%; bottom: 0; height: 68%; aspect-ratio: 300 / 280;
    color: #1a0d06; filter: drop-shadow(0 -2px 0 rgba(0, 0, 0, .1)); z-index: 1;
  }
  .ind-gate svg { display: block; width: 100%; height: 100%; overflow: hidden; }
  @media (max-width: 820px) {
    .ind-gate { height: 48%; right: 4%; aspect-ratio: 190 / 280; }
    .ind-sun { width: 22%; }
  }
  .ind-ground {
    position: absolute; left: 0; right: 0; bottom: 0; height: 28%; background: #0c0602;
    clip-path: polygon(0% 72%, 24% 6%, 48% 30%, 100% 14%, 100% 100%, 0% 100%);
    z-index: 2;
  }
  .ind-flagpole {
    position: absolute; left: 12%; bottom: 20%; width: 4px; height: 55%;
    display: flex; justify-content: center; z-index: 3;
  }
  .ind-pole {
    width: 4px; height: 100%;
    background: linear-gradient(90deg, #6b5a4a, #cbb89a, #6b5a4a); border-radius: 2px;
  }
  .ind-pole::before {
    content: ''; position: absolute; top: -6px; left: 50%; width: 10px; height: 10px;
    transform: translateX(-50%); background: #d4af37; border-radius: 50%;
    box-shadow: 0 0 8px rgba(212, 175, 55, .8);
  }
  /* No bottom/transform transition on the base rule, unlike the dashboard
     version — here bottom/transform are driven frame-by-frame from the
     hold-to-hoist interaction (see hoistFrame()), and a transition would
     just fight/lag behind those per-frame writes. Explicit short
     transitions are set inline in JS only for the two *discrete* moments
     that need one: releasing early (ease back down) and "Hoist again"
     (reset). */
  .ind-flag-wrap {
    position: absolute; left: 2px; bottom: 4%; width: 84px; height: 56px;
    transform-origin: left center; transform: scaleX(.12) scaleY(.55); opacity: .92;
  }
  .ind-flag-wrap.ind-unfurled { transform: scaleX(1) scaleY(1); }
  .ind-flag-inner { width: 100%; height: 100%; }
  .ind-flag-wrap.ind-unfurled .ind-flag-inner { animation: ind-wave 2.3s ease-in-out infinite; transform-origin: left center; }
  @keyframes ind-wave {
    0%, 100% { transform: skewY(0deg) scaleY(1); }
    50% { transform: skewY(-4deg) scaleY(.97); }
  }
  .ind-flag-svg { width: 100%; height: 100%; display: block; }
  .ind-jets { position: absolute; inset: 0; overflow: hidden; pointer-events: none; z-index: 4; }
  .ind-jet-art {
    position: absolute; top: 0; left: 0;
    filter: drop-shadow(0 2px 6px rgba(0, 0, 0, .3));
    animation-name: ind-jet-art-fly; animation-timing-function: linear; animation-fill-mode: forwards;
    offset-rotate: 0deg;
  }
  @keyframes ind-jet-art-fly {
    0% { offset-distance: 0%; opacity: 0; }
    8% { opacity: 1; }
    88% { opacity: 1; }
    100% { offset-distance: 100%; opacity: 0; }
  }
  .ind-petals { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
  .ind-petal {
    position: absolute; top: -8%;
    animation-name: ind-petal-fall; animation-timing-function: ease-in; animation-fill-mode: forwards;
    will-change: transform, opacity;
  }
  @keyframes ind-petal-fall {
    0% { transform: translateY(0) translateX(0) rotate(0deg); opacity: 0; }
    10% { opacity: 1; }
    55% { transform: translateY(calc(var(--petal-fall, 400px) * .58)) translateX(20px) rotate(160deg); }
    92% { opacity: 1; }
    100% { transform: translateY(var(--petal-fall, 400px)) translateX(-14px) rotate(320deg); opacity: 0; }
  }

  /* ══════════ Microsite-specific UI (landing / share panels) ══════════ */
  .mic-controls {
    position: absolute; left: 0; right: 0; bottom: 0; z-index: 6;
    display: flex; flex-direction: column; align-items: center; gap: 8px;
    padding: 28px 20px calc(38px + env(safe-area-inset-bottom, 0px));
    text-align: center;
    background: linear-gradient(180deg, transparent 0%, rgba(7, 3, 1, .55) 40%, rgba(7, 3, 1, .9) 100%);
  }
  .mic-referred { font-size: 13px; color: #ffd54a; font-weight: 600; margin-bottom: 2px; }
  .mic-title { font-size: 26px; font-weight: 800; color: #fff; text-shadow: 0 2px 8px rgba(0, 0, 0, .5); margin: 0; }
  .mic-sub { font-size: 14px; color: rgba(255, 255, 255, .82); margin: 0 0 6px; max-width: 320px; }
  .mic-count { font-size: 12.5px; color: rgba(255, 255, 255, .65); margin-bottom: 4px; min-height: 16px; }
  .mic-hold-btn {
    padding: 18px 40px; font-size: 16px; touch-action: none; position: relative; overflow: hidden;
    transition: transform .15s ease;
  }
  .mic-hold-btn.is-holding { transform: scale(.96); }
  .mic-hold-fill {
    position: absolute; inset: 0; left: 0; width: 0%;
    background: rgba(255, 255, 255, .3); pointer-events: none;
  }
  .mic-hint { font-size: 12px; color: rgba(255, 255, 255, .55); margin-top: 2px; }
  .mic-share-actions { display: flex; gap: 10px; margin-top: 8px; flex-wrap: wrap; justify-content: center; }
  .mic-share-actions .btn { padding: 13px 24px; font-size: 14px; }
  .mic-share-status { font-size: 12.5px; color: #ffd54a; max-width: 320px; margin-top: 4px; min-height: 16px; line-height: 1.4; }
  .mic-name-row { display: flex; gap: 6px; align-items: center; margin-top: 4px; }
  .mic-name-row input {
    background: rgba(255, 255, 255, .1); border: 1px solid rgba(255, 255, 255, .25); border-radius: 999px;
    color: #fff; padding: 8px 14px; font-size: 13px; width: 170px; text-align: center; outline: none;
  }
  .mic-name-row input::placeholder { color: rgba(255, 255, 255, .5); }
  .mic-name-row input:focus { border-color: #ff9457; }
</style>

<script>
(function buildChakraSpokes() {
  const g = document.getElementById('ind-chakra');
  if (!g) return;
  const NS = 'http://www.w3.org/2000/svg';
  for (let i = 0; i < 24; i++) {
    const line = document.createElementNS(NS, 'line');
    line.setAttribute('x1', '0'); line.setAttribute('y1', '0');
    line.setAttribute('x2', '0'); line.setAttribute('y2', '-11');
    line.setAttribute('stroke', '#0000AA');
    line.setAttribute('stroke-width', '0.7');
    line.setAttribute('transform', 'rotate(' + (i * 15) + ')');
    g.appendChild(line);
  }
})();

// Mobile: swap the gate SVG to a "cover"/cropped fit so it can go taller
// without its width ballooning at the same rate — same technique as the
// dashboard's Independence Day page (see index.html's
// applyIndGateResponsiveCrop for the full rationale).
function applyIndGateResponsiveCrop() {
  const gate = document.querySelector('.ind-gate');
  const svg = gate ? gate.querySelector('svg') : null;
  if (!gate || !svg) return;
  const isMobile = window.matchMedia('(max-width: 820px)').matches;
  svg.setAttribute('preserveAspectRatio', isMobile ? 'xMidYMax slice' : 'xMidYMax meet');
}
applyIndGateResponsiveCrop();
window.addEventListener('resize', applyIndGateResponsiveCrop);

// ── Jet flypast + fireworks + petals — unchanged from the dashboard's
// Independence Day page (index.html); see that file's comments for the
// full history of why these are built the way they are (vector asset over
// hand-drawn/photo jets, gradient-faded trail baked into the art, wavy
// offset-path confined to a top lane, etc).
function buildWavyPoints(xStart, xEnd, baseY, amp, waves, phase, n) {
  const pts = [];
  for (let i = 0; i <= n; i++) {
    const t = i / n;
    const x = xStart + (xEnd - xStart) * t;
    const y = baseY + Math.sin(t * Math.PI * waves + phase) * amp * Math.sin(t * Math.PI);
    pts.push({ x, y });
  }
  return pts;
}
function pathFromPoints(pts) {
  if (pts.length < 2) return '';
  let d = 'M ' + pts[0].x.toFixed(1) + ',' + pts[0].y.toFixed(1);
  for (let i = 1; i < pts.length - 1; i++) {
    const mx = (pts[i].x + pts[i + 1].x) / 2;
    const my = (pts[i].y + pts[i + 1].y) / 2;
    d += ' Q ' + pts[i].x.toFixed(1) + ',' + pts[i].y.toFixed(1) + ' ' + mx.toFixed(1) + ',' + my.toFixed(1);
  }
  const last = pts[pts.length - 1];
  d += ' T ' + last.x.toFixed(1) + ',' + last.y.toFixed(1);
  return d;
}
function spawnJets(container) {
  if (!container) return;
  container.innerHTML = '';
  const rect = container.getBoundingClientRect();
  const W = Math.max(1, rect.width), H = Math.max(1, rect.height);
  const imgW = Math.max(190, Math.min(400, W * 0.28));
  const imgH = imgW;
  const amp = Math.min(70, Math.max(28, H * 0.045));
  const waves = 2.2;
  const instances = [
    { flip: 1, duration: 8, delay: 0, baseYPct: 20, phase: 0 },
    { flip: -1, duration: 8.3, delay: 1.8, baseYPct: 13, phase: .6 }
  ];
  instances.forEach(inst => {
    const baseY = H * inst.baseYPct / 100;
    const xStart = inst.flip === -1 ? W + imgW * 0.6 : -imgW * 0.6;
    const xEnd = inst.flip === -1 ? -imgW * 0.6 : W + imgW * 0.6;
    const pts = buildWavyPoints(xStart, xEnd, baseY, amp, waves, inst.phase, 12);
    const img = document.createElement('img');
    img.className = 'ind-jet-art';
    img.src = '/assets/independence-day/jets-formation.svg';
    img.alt = '';
    img.style.width = imgW + 'px';
    img.style.height = imgH + 'px';
    img.style.offsetPath = "path('" + pathFromPoints(pts) + "')";
    img.style.animationDuration = inst.duration + 's';
    img.style.animationDelay = inst.delay + 's';
    img.style.transform = inst.flip === -1 ? 'rotate(-48.3deg) scaleX(-1)' : 'rotate(48.3deg)';
    container.appendChild(img);
  });
  const maxLife = Math.max(...instances.map(i => i.duration + i.delay)) * 1000 + 400;
  setTimeout(() => { if (container) container.innerHTML = ''; }, maxLife);
}
function spawnFireworks(container) {
  if (!container) return;
  container.innerHTML = '';
  const colors = ['#FFFFFF', '#138808', '#FFD54A', '#29B6F6'];
  const burstCount = 8;
  let maxLife = 0;
  for (let i = 0; i < burstCount; i++) {
    const delay = i === 0 ? 0 : i * 700 + Math.random() * 350;
    const left = 10 + Math.random() * 78;
    const top = 6 + Math.random() * 32;
    const color = colors[Math.floor(Math.random() * colors.length)];
    const particleCount = 16 + Math.floor(Math.random() * 6);
    const dist = 52 + Math.random() * 36;
    const duration = 1.1 + Math.random() * .5;
    setTimeout(() => {
      if (!container.isConnected) return;
      const fw = document.createElement('div');
      fw.className = 'ind-firework';
      fw.style.left = left + '%';
      fw.style.top = top + '%';
      fw.style.setProperty('--fw-color', color);
      const flash = document.createElement('div');
      flash.className = 'ind-firework-flash';
      fw.appendChild(flash);
      for (let p = 0; p < particleCount; p++) {
        const particle = document.createElement('span');
        particle.className = 'ind-firework-particle';
        particle.style.setProperty('--angle', (p * (360 / particleCount) + Math.random() * 10) + 'deg');
        particle.style.setProperty('--fw-dist', dist + 'px');
        particle.style.background = color;
        particle.style.boxShadow = '0 0 8px 2px ' + color;
        particle.style.animationDuration = duration + 's';
        fw.appendChild(particle);
      }
      container.appendChild(fw);
      setTimeout(() => { if (fw.parentNode) fw.parentNode.removeChild(fw); }, duration * 1000 + 200);
    }, delay);
    maxLife = Math.max(maxLife, delay + duration * 1000 + 300);
  }
  setTimeout(() => { if (container) container.innerHTML = ''; }, maxLife + 200);
}
function spawnPetals(container) {
  if (!container) return;
  container.innerHTML = '';
  const fallPx = Math.max(300, container.getBoundingClientRect().height) * 1.1;
  container.style.setProperty('--petal-fall', fallPx + 'px');
  const emojis = ['🌸', '🌼', '🏵️', '🌺'];
  for (let i = 0; i < 34; i++) {
    const p = document.createElement('span');
    p.className = 'ind-petal';
    p.textContent = emojis[Math.floor(Math.random() * emojis.length)];
    p.style.left = Math.random() * 100 + '%';
    p.style.fontSize = (11 + Math.random() * 9) + 'px';
    p.style.animationDuration = (3.6 + Math.random() * 2.4) + 's';
    p.style.animationDelay = (Math.random() * 1.4) + 's';
    container.appendChild(p);
  }
  setTimeout(() => { if (container) container.innerHTML = ''; }, 8000);
}
function playVandeMataram() {
  const audio = document.getElementById('ind-vande-mataram');
  if (!audio) return;
  try {
    audio.currentTime = 0;
    const p = audio.play();
    if (p && p.catch) p.catch(() => {});
  } catch (e) {}
}

// ══════════ Microsite-specific: hold-to-hoist, share loop, referral ══════════

const params = new URLSearchParams(location.search);
const referrerSlug = params.get('from');

function unslug(s) {
  return s.replace(/-/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
}
if (referrerSlug) {
  const el = document.getElementById('referred-line');
  el.style.display = '';
  el.textContent = unslug(referrerSlug) + ' hoisted the flag. 🇮🇳 Now it\'s your turn.';
}

function slugify(s) {
  return s.toLowerCase().trim().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 24);
}
function randomSlug() {
  const adjectives = ['bold', 'swift', 'proud', 'free', 'brave', 'bright', 'united', 'fearless'];
  const a = adjectives[Math.floor(Math.random() * adjectives.length)];
  return a + '-loonatic-' + Math.floor(1000 + Math.random() * 9000);
}
let mySlug = randomSlug();

const HOIST_ENDPOINT = '/.netlify/functions/independence-hoist';

fetch(HOIST_ENDPOINT).then(r => r.json()).then(d => {
  const el = document.getElementById('daily-count-line');
  el.textContent = d.count > 0 ? d.count.toLocaleString() + ' flag' + (d.count === 1 ? '' : 's') + ' hoisted today' : '';
}).catch(() => {});

function ordinal(n) {
  const s = ['th', 'st', 'nd', 'rd'], v = n % 100;
  return n.toLocaleString() + (s[(v - 20) % 10] || s[v] || s[0]);
}
function recordHoist() {
  fetch(HOIST_ENDPOINT, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ from: referrerSlug || null })
  }).then(r => r.json()).then(d => {
    document.getElementById('rank-line').textContent = "You're the " + ordinal(d.rank) + " person to raise the flag today. Now pass it on.";
  }).catch(() => { /* rank line already has a sensible default */ });
}

// ── The hold-to-hoist interaction itself ──
// Driven frame-by-frame from a single requestAnimationFrame loop rather
// than the dashboard's fixed-duration CSS-transition approach, since here
// the climb speed is literally however long the person holds — a genuine
// physical "raise it yourself" gesture (pointer events cover mouse, touch,
// and pen uniformly) instead of a single tap that plays a canned animation.
const wrap = document.getElementById('ind-flag-wrap');
const holdBtn = document.getElementById('hold-btn');
const holdFill = document.getElementById('hold-fill');
const holdLabel = document.getElementById('hold-btn-label');
const HOLD_MS = 2200;
let holding = false, holdStart = 0, rafId = null, completed = false;

function setFlagProgress(t) {
  // t: 0..1. Climb for the first 100%, with the unfurl (scale) only
  // kicking in over the final 30% so it visually "pops open" right as it
  // nears the top, echoing the dashboard version's climb-then-unfurl beat
  // instead of stretching open gradually the whole way up.
  const eased = 1 - Math.pow(1 - t, 2);
  wrap.style.bottom = (4 + eased * 84) + '%';
  const unfurlT = Math.max(0, Math.min(1, (t - 0.7) / 0.3));
  wrap.style.transform = 'scaleX(' + (.12 + unfurlT * .88).toFixed(3) + ') scaleY(' + (.55 + unfurlT * .45).toFixed(3) + ')';
}

function hoistFrame() {
  if (!holding) return;
  const t = Math.min(1, (Date.now() - holdStart) / HOLD_MS);
  setFlagProgress(t);
  holdFill.style.width = (t * 100) + '%';
  if (t >= 1) { completeHoist(); return; }
  rafId = requestAnimationFrame(hoistFrame);
}
function startHold(e) {
  if (e.cancelable) e.preventDefault();
  if (completed) return;
  holding = true;
  holdStart = Date.now();
  holdBtn.classList.add('is-holding');
  holdLabel.textContent = 'Keep holding…';
  wrap.style.transition = 'none';
  playVandeMataram();
  rafId = requestAnimationFrame(hoistFrame);
}
function endHold() {
  if (!holding) return;
  holding = false;
  holdBtn.classList.remove('is-holding');
  if (rafId) cancelAnimationFrame(rafId);
  if (!completed) {
    holdLabel.textContent = 'Hold to Hoist';
    holdFill.style.width = '0%';
    wrap.style.transition = 'bottom .6s ease-out, transform .6s ease-out';
    wrap.style.bottom = '4%';
    wrap.style.transform = 'scaleX(.12) scaleY(.55)';
    const audio = document.getElementById('ind-vande-mataram');
    if (audio) { try { audio.pause(); } catch (err) {} }
  }
}
holdBtn.addEventListener('pointerdown', startHold);
window.addEventListener('pointerup', endHold);
window.addEventListener('pointercancel', endHold);
// Releasing outside the button (finger/mouse drags off while holding) should
// still count as letting go — pointerleave on the button alone would miss
// drags that leave fast, so this listens on the window instead scoped by
// the `holding` flag rather than relying on the target still being the btn.

function completeHoist() {
  holding = false;
  completed = true;
  wrap.style.transition = '';
  wrap.style.bottom = '';
  wrap.style.transform = '';
  wrap.classList.add('ind-unfurled');
  spawnPetals(document.getElementById('ind-petals'));
  spawnJets(document.getElementById('ind-jets'));
  spawnFireworks(document.getElementById('ind-fireworks'));
  recordHoist();
  setTimeout(() => {
    document.getElementById('phase-landing').style.display = 'none';
    document.getElementById('phase-share').style.display = '';
    prepareStoryAssets();
  }, 1300);
}

document.getElementById('again-btn').addEventListener('click', () => {
  completed = false;
  wrap.classList.remove('ind-unfurled');
  wrap.style.transition = 'bottom .5s ease-in, transform .5s ease-in';
  wrap.style.bottom = '4%';
  wrap.style.transform = 'scaleX(.12) scaleY(.55)';
  setTimeout(() => { wrap.style.transition = 'none'; }, 550);
  holdFill.style.width = '0%';
  holdLabel.textContent = 'Hold to Hoist';
  document.getElementById('phase-share').style.display = 'none';
  document.getElementById('phase-landing').style.display = '';
});

// ── Name -> personalized referral link, and the shareable Story image ──
const nameInput = document.getElementById('name-input');
nameInput.addEventListener('input', () => {
  mySlug = slugify(nameInput.value) || randomSlug();
  prepareStoryAssets();
});

function shareUrl() {
  return location.origin + '/independence/?from=' + encodeURIComponent(mySlug);
}

let latestStoryBlob = null;
function prepareStoryAssets() {
  buildStoryImage(shareUrl(), blob => { latestStoryBlob = blob; });
}

// Draws a 1080x1920 (Story-ratio) branded card: "I HOISTED THE FLAG 🇮🇳 /
// Your turn. / <url>" plus a QR code, instead of sharing a generic "Happy
// Independence Day" image — the whole point (per the brief) is that what
// gets shared is itself an invitation with the link baked in, not just a
// nice graphic, so the chain can actually continue when someone sees it.
function buildStoryImage(url, callback) {
  const canvas = document.getElementById('story-canvas');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;

  const grad = ctx.createLinearGradient(0, 0, 0, H);
  grad.addColorStop(0, '#ff7a30');
  grad.addColorStop(.32, '#fb5713');
  grad.addColorStop(.6, '#8f2605');
  grad.addColorStop(1, '#150602');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);

  const stripeY = 150, stripeH = 22;
  ctx.fillStyle = '#FF9933'; ctx.fillRect(0, stripeY, W, stripeH);
  ctx.fillStyle = '#FFFFFF'; ctx.fillRect(0, stripeY + stripeH, W, stripeH);
  ctx.fillStyle = '#138808'; ctx.fillRect(0, stripeY + stripeH * 2, W, stripeH);

  ctx.textAlign = 'center';
  ctx.fillStyle = '#fff';
  ctx.font = '800 92px system-ui, -apple-system, sans-serif';
  ctx.fillText('I HOISTED', W / 2, 560);
  ctx.fillText('THE FLAG 🇮🇳', W / 2, 668);

  ctx.font = '600 48px system-ui, -apple-system, sans-serif';
  ctx.fillStyle = 'rgba(255,255,255,.9)';
  ctx.fillText('Your turn.', W / 2, 760);

  ctx.font = '600 30px system-ui, -apple-system, sans-serif';
  ctx.fillStyle = '#FFD54A';
  ctx.fillText(url.replace(/^https?:\/\//, ''), W / 2, 1770);

  const finish = () => canvas.toBlob(blob => callback(blob), 'image/png');

  const qr = new Image();
  qr.crossOrigin = 'anonymous';
  qr.onload = () => {
    const qs = 280;
    const qx = W / 2 - qs / 2, qy = 1400;
    ctx.fillStyle = '#fff';
    ctx.fillRect(qx - 18, qy - 18, qs + 36, qs + 36);
    ctx.drawImage(qr, qx, qy, qs, qs);
    finish();
  };
  qr.onerror = finish; // still produce a shareable image even if the QR API is unreachable
  qr.src = 'https://api.qrserver.com/v1/create-qr-code/?size=280x280&data=' + encodeURIComponent(url);
}

document.getElementById('share-btn').addEventListener('click', async () => {
  const status = document.getElementById('share-status');
  const url = shareUrl();
  const finish = async (blob) => {
    let shared = false;
    if (navigator.canShare && blob) {
      try {
        const file = new File([blob], 'loona-independence-hoist.png', { type: 'image/png' });
        if (navigator.canShare({ files: [file] })) {
          try { await navigator.clipboard.writeText(url); } catch (e) {}
          await navigator.share({ files: [file], title: 'I hoisted the flag 🇮🇳', text: 'Your turn: ' + url });
          shared = true;
        }
      } catch (e) { /* user cancelled the native share sheet, or share failed — fall through */ }
    }
    if (!shared) {
      if (blob) {
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'loona-independence-hoist.png';
        document.body.appendChild(a); a.click(); a.remove();
      }
      try { await navigator.clipboard.writeText(url); } catch (e) {}
    }
    status.textContent = 'Your Story is ready. Add a Link sticker and paste the link we copied for you.';
  };
  if (latestStoryBlob) finish(latestStoryBlob);
  else buildStoryImage(url, finish);
});
</script>
